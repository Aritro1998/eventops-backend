services:

  db:
    image: pgvector/pgvector:pg15
    container_name: eventops_db
    restart: always
    environment:
      POSTGRES_DB: eventops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: eventops_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: eventops_web
    env_file:
      - .env
    volumes:
      - .:/app
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  gradio:
    build: .
    container_name: eventops_gradio
    command: python gradio_app.py
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "7860:7860"
    depends_on:
      - web

  celery:
    build: .
    container_name: eventops_celery
    # Concurrency defaults to the host's CPU count (10 here) with no cap,
    # meaning 10 full worker child processes - each a complete copy of the
    # loaded Django app - for a dev setup that never runs that much
    # concurrent task load. 2 is plenty for local booking-expiry checks
    # and embedding generation without wasting memory on idle workers.
    command: celery -A core.celery worker -l info --concurrency=2
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
  
  celery-beat:
    build: .
    container_name: eventops_celery_beat
    command: celery -A core.celery beat -l info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

  nginx:
    image: nginx:alpine
    container_name: eventops_nginx
    profiles: ["prod"]
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - web

# volumes for postgres data persistence + collectstatic output (kept
# inside a Docker-managed volume rather than the .:/app bind mount, so
# static files never land on the host filesystem)
volumes:
  postgres_data:
  static_files:
