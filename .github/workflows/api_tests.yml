name: api_tests

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: pgvector/pgvector:pg15
                env:
                    POSTGRES_DB: eventops
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7
                ports:
                    - 6379:6379

        env:
            DJANGO_SETTINGS_MODULE: core.settings.dev
            SECRET_KEY: ci-test-secret-key
            DB_NAME: eventops
            DB_USER: postgres
            DB_PASSWORD: postgres
            DB_HOST: localhost
            DB_PORT: 5432
            REDIS_HOST: localhost
            REDIS_PORT: 6379
            OPENAI_API_KEY: sk-fake-key-not-used-in-tests

        steps:
            -   uses: actions/checkout@v4

            -   uses: actions/setup-python@v5
                with:
                    python-version: "3.11"

            -   name: Install dependencies
                run: pip install -r requirements.txt

            -   name: Lint with Ruff
                run: ruff check .

            -   name: Security audit dependencies
                # continue-on-error: the remaining known CVEs here (pytest,
                # the langchain/langgraph stack) only have major-version
                # fixes available - bumping them needs a deliberate,
                # separate pass to re-verify the AI assistant end-to-end,
                # not a silent dependency bump. Keeping this step non-
                # blocking preserves visibility without failing every build
                # on issues we're not fixing yet.
                continue-on-error: true
                run: pip-audit -r requirements.txt

            -   name: Run migrations
                run: python manage.py migrate

            -   name: Run tests
                run: python manage.py test



            